# iOS Build (cloud Mac) — Grok Bot Widget
#
# Runs on GitHub-hosted macOS runners (real Apple hardware, Xcode preinstalled).
# No Mac of your own is needed to RUN this workflow — but you do need a
# GitHub account + a repository to put the code in (see README-CLOUD-BUILD.md).
#
# Single job on purpose: two parallel jobs need two macOS runners at once,
# which is what kept queueing. One job needs only one runner.
# Runs on macos-14 (older runner pool, usually less congested than macos-26/15).
#
# What this workflow CAN do (no Apple account needed):
#   - Compile the app + widget extension for the iOS Simulator, unsigned.
#   - Produce an unsigned .ipa (archive, signing disabled).
# What it CANNOT do:
#   - Install anything on a real iPhone. An unsigned build cannot be
#     installed on a stock iPhone, and App Groups (which this widget uses
#     to share state) normally do NOT work on a free personal team.
#     A real-device install needs Apple signing — the optional signed
#     job was removed from this file because its job-level secrets
#     guard made the workflow invalid; see the Job 2 comment at the
#     bottom and README-CLOUD-BUILD.md.

name: iOS Build (Cloud Mac)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned, no Apple account)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets
        run: xcodebuild -list -project GrokBotWidgetApp.xcodeproj

      # NOTE: this project ships no shared .xcscheme, so build by -target,
      # not -scheme. Building the app target also builds the embedded
      # widget extension.
      - name: Build app + widget for Simulator (signing disabled)
        run: |
          xcodebuild \
            -project GrokBotWidgetApp.xcodeproj \
            -target GrokBotWidgetApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate the built .app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "GrokBotWidgetApp.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          test -n "$APP_PATH" && ls -la "$APP_PATH"

      - name: Upload Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: GrokBotWidgetApp-simulator
          path: ${{ env.APP_PATH }}
          if-no-files-found: error

      - name: Archive (signing disabled)
        run: |
          xcodebuild \
            -project GrokBotWidgetApp.xcodeproj \
            -target GrokBotWidgetApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/GrokBotWidgetApp.xcarchive

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/GrokBotWidgetApp.xcarchive/Products/Applications/GrokBotWidgetApp.app build/Payload/
          cd build && zip -r GrokBotWidgetApp-unsigned.ipa Payload

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: GrokBotWidgetApp-unsigned-ipa
          path: build/GrokBotWidgetApp-unsigned.ipa
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 2 (OPTIONAL, removed for now): signed archive for a real iPhone.
  # It was removed because a job-level `if: secrets...` makes the whole
  # workflow file invalid on GitHub (secrets are not recognised in a
  # job-level `if`). Re-add it only once the repo has these secrets set
  # (Settings -> Secrets and variables -> Actions):
  #   APPLE_TEAM_ID, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
  # and guard it with a step-level check instead of a job-level `if`,
  # e.g. `if: env.DEVELOPMENT_TEAM != ''` with the secret mapped into
  # `env:` first. The App Group `group.com.grokbot.widget` must also
  # exist under that team. Free personal teams usually CANNOT use App
  # Groups; in practice this needs the paid Apple Developer Program
  # ($99/year). See README-CLOUD-BUILD.md.
  # ------------------------------------------------------------------
